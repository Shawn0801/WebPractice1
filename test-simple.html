<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡單輪播測試</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }

    .hero-section {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .hero-slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hero-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: white;
      font-weight: bold;
    }

    .hero-slide.active {
      opacity: 1;
    }

    .info {
      position: fixed;
      top: 20px;
      left: 20px;
      background: black;
      color: white;
      padding: 20px;
      border-radius: 10px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div class="info">
    <div>當前: <span id="current">0</span></div>
    <div>總數: <span id="total">0</span></div>
    <div>狀態: <span id="status">載入中...</span></div>
  </div>

  <div class="hero-section">
    <div class="hero-slideshow">
      <div class="hero-slide active" style="background-color: #ff6b6b;">幻燈片 1</div>
      <div class="hero-slide" style="background-color: #4ecdc4;">幻燈片 2</div>
      <div class="hero-slide" style="background-color: #45b7d1;">幻燈片 3</div>
      <div class="hero-slide" style="background-color: #96ceb4;">幻燈片 4</div>
      <div class="hero-slide" style="background-color: #ffeaa7;">幻燈片 5</div>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.hero-slide');
    const currentEl = document.getElementById('current');
    const totalEl = document.getElementById('total');
    const statusEl = document.getElementById('status');

    totalEl.textContent = slides.length;
    let currentSlide = 0;

    if (slides.length > 0) {
      statusEl.textContent = '運行中 (每2秒切換)';

      setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
        currentEl.textContent = currentSlide + 1;
      }, 2000);
    } else {
      statusEl.textContent = '錯誤：找不到幻燈片';
    }
  </script>
</body>
</html>
