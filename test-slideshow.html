<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投影片測試</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .hero-section {
      position: relative;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero-slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .hero-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
    }

    .hero-slide.active {
      opacity: 1;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(212, 165, 165, 0.4) 0%, rgba(232, 180, 184, 0.35) 50%, rgba(139, 79, 86, 0.3) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 2rem;
      color: white;
    }

    .debug-info {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px;
      border-radius: 5px;
      z-index: 9999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header class="hero-section">
    <div class="hero-slideshow">
      <div class="hero-slide active" style="background-image: url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1600&q=80');"></div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1606800052052-a08af7148866?w=1600&q=80');"></div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1511285560929-80b456fea0bc?w=1600&q=80');"></div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1591604466107-ec97de577aff?w=1600&q=80');"></div>
      <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1519225421980-715cb0215aed?w=1600&q=80');"></div>
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>投影片輪播測試</h1>
      <p>應該每 3 秒切換一次照片</p>
    </div>
  </header>

  <div class="debug-info">
    <div>當前投影片: <span id="currentIndex">0</span></div>
    <div>總投影片數: <span id="totalSlides">0</span></div>
    <div>狀態: <span id="status">初始化中...</span></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM 載入完成');

      const slides = document.querySelectorAll('.hero-slide');
      const currentIndexEl = document.getElementById('currentIndex');
      const totalSlidesEl = document.getElementById('totalSlides');
      const statusEl = document.getElementById('status');

      console.log('找到投影片數量:', slides.length);
      totalSlidesEl.textContent = slides.length;

      if (!slides || slides.length === 0) {
        statusEl.textContent = '錯誤：找不到投影片元素';
        console.error('找不到投影片元素');
        return;
      }

      let currentSlide = 0;
      statusEl.textContent = '運行中';

      // 每 3 秒切換到下一張照片（縮短時間以便測試）
      setInterval(function() {
        console.log('切換投影片，當前:', currentSlide);

        // 移除當前幻燈片的 active 類別
        slides[currentSlide].classList.remove('active');

        // 移動到下一張幻燈片
        currentSlide = (currentSlide + 1) % slides.length;

        // 添加 active 類別到新的幻燈片
        slides[currentSlide].classList.add('active');

        // 更新調試資訊
        currentIndexEl.textContent = currentSlide;
        console.log('新的投影片:', currentSlide);
      }, 3000); // 3000 毫秒 = 3 秒

      console.log('投影片輪播已啟動');
    });
  </script>
</body>
</html>
